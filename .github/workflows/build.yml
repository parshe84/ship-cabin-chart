name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    # ubuntu-24.04 ships with the Android SDK preinstalled (ANDROID_HOME)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-gps-sender
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests and APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-gps-sender-apk
          path: android-gps-sender/app/build/outputs/apk/release/*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: dist:win
            artifact: desktop-chart/dist/*.exe
          - os: ubuntu-24.04
            target: dist:linux
            artifact: desktop-chart/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-chart
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-chart/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-chart-${{ matrix.os }}
          path: ${{ matrix.artifact }}
