name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  android:
    # ubuntu-24.04 ships with the Android SDK preinstalled (ANDROID_HOME)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-gps-sender
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests and APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-gps-sender-apk
          path: android-gps-sender/app/build/outputs/apk/release/*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: dist:win
            artifact: desktop-chart/dist/*.exe
          - os: ubuntu-24.04
            target: dist:linux
            artifact: desktop-chart/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-chart
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-chart/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-chart-${{ matrix.os }}
          path: ${{ matrix.artifact }}

  # Publishes a GitHub Release when the version in desktop-chart/package.json is new
  # (or when a v* tag is pushed). The release action creates the tag itself.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [android, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./desktop-chart/package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          path: artifacts
      - name: Collect files
        if: steps.version.outputs.publish == 'true'
        run: |
          mkdir release
          cp artifacts/android-gps-sender-apk/*.apk "release/CabinGPS-${{ steps.version.outputs.tag }}.apk"
          cp artifacts/desktop-chart-windows-latest/*.exe release/
          cp artifacts/desktop-chart-ubuntu-24.04/*.AppImage release/
          ls -la release
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ship Cabin Chart ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
